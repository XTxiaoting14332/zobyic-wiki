# Zobyic Realms Wiki 内容管理配置
# 文档: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: XTxiaoting14332/zobyic-wiki
  branch: main
  # === 代理网关（proxy/ 目录里的 CF Worker）部署完成后启用 ===
  # 原理：浏览器 -> CF Worker（校验登录+注入你的 GitHub token） -> api.github.com
  # 部署见 proxy/wrangler.toml；部署后把下面的域名替换成你的 worker 域名并取消注释：
  # base_url: https://your-proxy-worker.workers.dev
  # auth_endpoint: auth
  # api_root: https://your-proxy-worker.workers.dev
  site_domain: zobyic-wiki.vercel.app # TODO: 替换为部署后的实际域名

# 上传的图片保存位置（相对仓库根目录）
media_folder: "docs/public/uploads"
# 图片在发布站点上的公开路径
public_folder: "/uploads"

# 内容集合：wiki 页面
collections:
  - name: "wiki"
    label: "Wiki 页面"
    label_singular: "页面"
    folder: "docs/wiki"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "wiki/{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "简介", name: "description", widget: "string", required: false }
      - { label: "正文", name: "body", widget: "markdown" }