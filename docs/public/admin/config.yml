# Zobyic Realms Wiki 内容管理配置
# 文档: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: XTxiaoting14332/zobyic-wiki
  branch: main
  # === 代理网关（proxy/ 目录里的 CF Worker）已部署 ===
  # 原理：浏览器 -> CF Worker（校验登录+注入你的 GitHub token） -> api.github.com
  base_url: https://wiki-gateway.zobyic.top
  auth_endpoint: auth
  api_root: https://wiki-gateway.zobyic.top
  site_domain: wiki.zobyic.top

# 上传的图片保存位置（相对仓库根目录）
media_folder: "docs/public/uploads"
# 图片在发布站点上的公开路径
public_folder: "/uploads"

# 登录页大图标：替换默认的 Decap CMS 标志为服务器 Logo
logo_url: /zbLOGO.png

# 内容集合：wiki 页面
collections:
  - name: "wiki"
    label: "Wiki 页面"
    label_singular: "页面"
    folder: "docs/wiki"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "wiki/{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "简介", name: "description", widget: "string", required: false }
      - { label: "正文", name: "body", widget: "markdown" }