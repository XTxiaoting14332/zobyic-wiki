<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>内容管理后台</title>
  <style>
    /* 全局字体平滑优化 */
    body, button, input, textarea, select {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 登录页面 Logo 约束（保持高分辨率展示且居中比例合适） */
    [class*="AuthenticationPage"] img,
    [class*="StyledAuthenticationPage"] img {
      max-width: 280px !important;
      max-height: 120px !important;
      object-fit: contain !important;
      margin-bottom: 20px !important;
    }

    /* 移动端适配：触控目标 ≥44px 与卡片自适应 */
    @media (max-width: 768px) {
      /* 编辑器主工具栏按钮 */
      [class*="ToolbarButton"]:not([class*="StyledToolbarButton"]),
      [class*="DropdownButton"],
      [class*="PublishButton"],
      [class*="BackArrow"],
      [class*="EditorToggle"],
      [class*="DeleteButton"] {
        min-height: 44px !important;
        min-width: 44px !important;
      }
      /* 工具栏允许横向滚动 */
      [class*="ToolbarContainer"] {
        overflow-x: auto !important;
        flex-wrap: nowrap !important;
      }
      /* 条目列表卡片：全宽显示，方便点按 */
      [class*="ListCard"] {
        width: calc(100vw - 24px) !important;
        margin-left: 12px !important;
        margin-right: 12px !important;
      }
      [class*="ListCardLink"] {
        padding: 18px 16px !important;
      }
      [class*="GridCard"] {
        flex-basis: calc(100vw - 24px) !important;
        height: auto !important;
        min-height: 120px !important;
      }
      /* 列表项顶栏（折叠/删除图标按钮）加大触控区 */
      [class*="TopBarButton"] {
        min-width: 44px !important;
        min-height: 44px !important;
      }
      /* 顶部操作区 */
      [class*="CollectionTop"] {
        padding: 12px !important;
        flex-wrap: wrap !important;
      }
      [class*="CollectionTop"] button {
        min-height: 44px !important;
      }
    }
  </style>
</head>
<body>
  <!-- 配置来自同目录 config.yml（由 scripts/gen-admin-config.mjs 从 sections.json 生成） -->
  <script src="./decap-cms.js"></script>
  <script>
    // 注册 VitePress 风格实时预览样式
    if (window.CMS) {
      window.CMS.registerPreviewStyle('/admin/preview.css');
    }

    (function () {
      // 兼容中英文环境：将登录按钮文字统一替换为中文
      function replaceLoginText() {
        var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        var nodes = [];
        var node;
        while ((node = walker.nextNode())) nodes.push(node);
        nodes.forEach(function (n) {
          if (n.nodeValue) {
            var val = n.nodeValue.trim();
            if (val === 'Login with GitHub' || val === '使用 GitHub 登录') {
              n.nodeValue = '登录到管理后台';
            }
          }
        });
      }

      // 将登录按钮里的 GitHub 图标替换为站点 Logo
      function replaceGitHubIcon() {
        document.querySelectorAll('button').forEach(function (btn) {
          var text = btn.textContent || '';
          if (text.indexOf('登录到管理后台') === -1 && text.indexOf('使用 GitHub 登录') === -1) return;
          if (btn.querySelector('img')) return;
          var svg = btn.querySelector('svg');
          if (!svg) return;
          var img = document.createElement('img');
          img.src = '/zbLOGO.png';
          img.alt = '';
          img.style.width = '20px';
          img.style.height = '20px';
          img.style.borderRadius = '4px';
          img.style.verticalAlign = 'middle';
          img.style.marginRight = '8px';
          svg.parentElement.replaceChild(img, svg);
        });
      }

      function removeCredit() {
        var el = document.querySelector('[class*="NetlifyCreditIcon"]');
        if (el && el.parentElement) el.parentElement.removeChild(el);
      }

      function run() {
        replaceLoginText();
        replaceGitHubIcon();
        removeCredit();
      }

      var obs = new MutationObserver(run);
      obs.observe(document.body, { childList: true, subtree: true });
      run();
    })();
  </script>
</body>
</html>
